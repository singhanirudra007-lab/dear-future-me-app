<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dear Future Me</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: 390x844 phone stage, one screen at a time, floating pill nav on Home */
:root{--bg:#FBFAF9;--ink:#1D1D1F;--grey:#6B6A70;--line:#ECEAE8;--soft:#F4F3F2;--btn:#2A2A2D;--purple:#6A58A8;--create:#7447B0;--green:#3C8A55;--mint:#DDF1E0;--gold:#F4D77A;--stage:#EDEAF3;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:'Instrument Sans',sans-serif;display:flex;align-items:center;justify-content:center;padding-block:12px}
#app{position:relative;width:390px;max-width:100%;height:min(844px,100%);background:var(--bg);border-radius:36px;overflow:hidden;box-shadow:0 30px 70px rgba(70,55,110,.2)}
@media(max-width:430px){body{padding:0;background:var(--bg)}#app{border-radius:0;box-shadow:none;height:100%}}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;padding:48px 24px 28px;overflow:hidden;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.scr{animation:none}}
.glow{position:absolute;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#ECE6F8 0%,rgba(236,230,248,0) 70%)}
.rel{position:relative}
h1{margin:0;font-family:'DM Mono',monospace;font-weight:400;font-size:30px;line-height:1.15;text-wrap:balance}
p{margin:8px 0 0;font-size:15px;line-height:1.5;color:var(--grey)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.top{position:relative;display:flex;align-items:center;justify-content:space-between;min-height:44px}
.back{width:44px;height:44px;display:flex;align-items:center}
.cta{position:relative;width:100%;height:54px;border-radius:999px;background:var(--btn);color:#fff;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;flex:none}
.cta[disabled]{opacity:.4;cursor:not-allowed}
.lbl{font-size:11px;font-weight:600;letter-spacing:.4px;color:var(--grey);text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);box-shadow:0 8px 24px rgba(60,50,90,.06)}
.field{width:100%;height:52px;border-radius:18px;border:1px solid var(--line);background:#fff;padding:0 16px;font:inherit;font-size:16px;color:var(--ink)}
.photo{position:relative;aspect-ratio:1;border-radius:18px;overflow:hidden;border:0;padding:0;background:#ddd}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.tick{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:var(--btn);color:#fff;display:none;align-items:center;justify-content:center}
.photo.on .tick{display:flex}.photo.on{box-shadow:0 0 0 3px var(--purple)}
.scroll{flex:1;min-height:0;overflow:auto;position:relative}
.cap{display:flex;align-items:center;gap:14px;padding:10px;border-radius:22px}
.cap img{width:64px;height:64px;border-radius:16px;object-fit:cover;flex:none}
.cap b{font-family:'DM Mono',monospace;font-weight:400;font-size:18px;display:block}
.cap span{font-size:13px;color:var(--grey)}
.pill{font-size:11px;font-weight:600;border-radius:999px;padding:4px 10px;background:#E8E2F6;color:var(--purple);flex:none}
.nav{position:absolute;left:14px;right:14px;bottom:14px;height:72px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 12px 30px rgba(60,50,90,.14);display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:#6B6A70;height:100%;min-width:0}
.nav button.on{color:var(--ink);font-weight:700}
.nav .mid{flex:none;width:84px;align-self:flex-start;justify-content:flex-start;height:auto;gap:4px;color:var(--purple);font-weight:600}
.plus{width:72px;height:72px;border-radius:50%;background:var(--create);display:flex;align-items:center;justify-content:center;margin-top:-34px;border:5px solid #fff;box-shadow:0 10px 26px rgba(116,71,176,.45)}
.tl{position:relative;padding-left:44px}.tl::before{content:"";position:absolute;left:10px;top:12px;bottom:10px;width:2px;background:#DDD8EA;border-radius:2px}
.tl .ent{position:relative;margin-bottom:16px;border-radius:26px;background:var(--soft);border:1px solid var(--line);padding:16px;width:100%;text-align:left;display:block}
.tl .ent::before{content:"";position:absolute;left:-39px;top:22px;width:10px;height:10px;border-radius:50%;background:#CFC9DF}
.ent .th{display:flex;gap:8px;margin-bottom:10px}.ent .th img{width:58px;height:58px;border-radius:18px;object-fit:cover}
.ent h3{margin:0;font-family:'DM Mono',monospace;font-weight:400;font-size:16px;line-height:1.35}
.ent .ex{font-size:14px;line-height:1.5;color:var(--grey);margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ent .dt{font-size:12px;color:var(--grey);margin-top:8px}
.ent .fav{position:absolute;right:14px;top:14px;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.circ{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal i{font-style:normal;font-size:11px;font-weight:600;color:var(--grey);padding:4px 0}
.cal button{aspect-ratio:1;border-radius:50%;font-size:14px;font-weight:500}
.cal button[disabled]{color:#C3C1C8;cursor:not-allowed}
.cal button.sel{background:var(--btn);color:#fff;font-weight:600}
.script{font-family:'Caveat',cursive;font-weight:600}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--btn);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;z-index:5}
.dots{display:flex;gap:8px;justify-content:center}.dots i{width:8px;height:8px;border-radius:99px;background:#D9D5E6;transition:.2s}.dots i.on{width:24px;background:var(--btn)}
.chip{padding:12px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px}.chip.on{background:var(--btn);color:#fff;border-color:var(--btn)}
.row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-radius:20px;gap:12px;width:100%;text-align:left}
.sw{width:48px;height:28px;border-radius:99px;background:#D9D5E6;position:relative;flex:none;transition:.2s}.sw::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}.sw.on{background:var(--create)}.sw.on::after{left:23px}
.lock img{filter:blur(8px) saturate(.8);transform:scale(1.15)}
.stat{flex:1;border-radius:20px;padding:14px;text-align:center}.stat b{display:block;font-family:'DM Mono',monospace;font-weight:400;font-size:26px}.stat span{font-size:12px;color:var(--grey)}
@keyframes pop{0%{transform:scale(.55)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes bump{50%{transform:scale(1.18);color:var(--purple)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes fadein{to{opacity:1}}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes glowp{50%{opacity:1;transform:scale(1.12)}}
@keyframes fall{to{transform:translate(var(--x),900px) rotate(var(--r))}}
@keyframes drop{0%{transform:translateY(-30px) rotate(-8deg) scale(1);opacity:0}15%{opacity:1}100%{transform:translateY(150px) rotate(4deg) scale(.3);opacity:0}}
@keyframes lid{from{transform:translateY(-70px);opacity:0}to{transform:none;opacity:1}}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.photo.pop{animation:pop .32s ease}.photo.pop .tick{animation:pop .4s .05s both}
.cal button{transition:background .15s,transform .1s}.cal button:not(.sel):not([disabled]):hover{background:#EFEBF8}.cal button:not([disabled]):active{transform:scale(.88)}
.cal button.pop{animation:pop .38s ease}
.bump{display:inline-block;animation:bump .3s}
.cta{transition:transform .12s,opacity .2s}.cta:active:not([disabled]){transform:scale(.97)}
.nav button,.circ,.chip{transition:transform .12s}.nav button:active,.circ:active{transform:scale(.9)}
.hc{display:flex;align-items:center;gap:14px;padding:10px 12px 10px 10px;border-radius:24px;position:relative;transition:transform .15s,box-shadow .15s}.hc:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(60,50,90,.1)}
.hc b{font-weight:600;font-size:16px;display:block;color:var(--ink)}.hc small{display:block;font-size:12px;color:var(--grey);margin-top:2px}.hc strong{display:block;font-size:14px;font-weight:500}
.menu{position:absolute;right:38px;top:14px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 30px rgba(60,50,90,.18);padding:6px;z-index:3;display:flex;flex-direction:column;animation:pop .2s}
.menu button{padding:10px 18px;font-size:14px;font-weight:600;text-align:left;border-radius:10px}.menu button:hover{background:var(--soft)}
.mk{display:flex;align-items:center;gap:16px;width:100%;margin-top:20px;height:88px;border-radius:28px;padding:0 22px;background:linear-gradient(110deg,#EDE7F8,#DCD2F1);border:1px solid #E4DCF4;text-align:left;font-size:17px;font-weight:500;line-height:1.25;transition:transform .15s}.mk:active{transform:scale(.98)}
.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed #BDB1DE;background:#F3EFFB;color:var(--purple);font-size:12px;font-weight:600;cursor:pointer;text-align:center;aspect-ratio:1;border-radius:18px;transition:background .15s,transform .15s}.add:hover{background:#EAE3F8;transform:translateY(-2px)}.add:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.seal{position:absolute;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fade .25s}
.seal .stage{position:relative;width:200px;height:260px}.seal .jar{position:absolute;left:20px;top:40px}
.seal .item{position:absolute;left:50px;top:0;width:100px;opacity:0;animation:drop 1.1s .3s cubic-bezier(.5,0,.8,.5) forwards}
.seal .lid{opacity:0;animation:lid .5s 1.35s cubic-bezier(.3,1.6,.5,1) forwards}
.seal .jstar{opacity:0;animation:fadein .4s 1.8s forwards}
.seal .sp{position:absolute;left:97px;top:150px;width:8px;height:8px;border-radius:2px;opacity:0;animation:burst .8s 1.85s ease-out forwards}
.chk{animation:pop .6s .1s both}.sjar{animation:float 3.2s ease-in-out infinite}.sjar circle{animation:glowp 2.2s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
.conf{position:absolute;top:-16px;width:8px;height:12px;border-radius:2px;animation:fall 2.4s ease-in forwards;pointer-events:none}
.shake{animation:shake .3s}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes land{from{opacity:0;transform:translateY(-90px) scale(.9)}to{opacity:1;transform:none}}
@keyframes wiggle{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes nudge{50%{transform:translateX(5px)}}
@keyframes breathe{50%{transform:scale(1.1)}}
@keyframes slf{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
@keyframes slb{from{opacity:0;transform:translateX(-44px)}to{opacity:1;transform:none}}
@keyframes typing{to{clip-path:inset(0 0 0 0)}}
@keyframes plane{from{opacity:0;transform:translate(-60px,40px) rotate(-10deg)}to{opacity:1;transform:translate(0,0) rotate(8deg)}}
.rise{opacity:0;animation:rise .6s var(--d,0s) cubic-bezier(.2,.8,.2,1) forwards}
.land{position:absolute;opacity:0;animation:land .8s var(--d,0s) cubic-bezier(.3,1.4,.5,1) forwards,float 4.5s calc(var(--d,0s) + .9s) ease-in-out infinite}
.breathe{animation:breathe 6s ease-in-out infinite}
.slf{animation:slf .45s cubic-bezier(.2,.8,.2,1)}.slb{animation:slb .45s cubic-bezier(.2,.8,.2,1)}
.nudge{display:inline-flex;animation:nudge 1.3s ease-in-out infinite}
.type{display:inline-block;clip-path:inset(0 100% 0 0);animation:typing 1.4s .5s steps(15) forwards}
.fl{animation:float 4.5s ease-in-out infinite}.fl2{animation:float 5.2s .6s ease-in-out infinite}
.dots button{padding:6px 2px}.dots i{display:block;transition:width .3s cubic-bezier(.3,1.4,.5,1),background .3s}
.chip.pop{animation:pop .38s}
.ob-item{position:absolute;left:50px;top:0;width:100px;opacity:0;animation:drop 1.1s .4s cubic-bezier(.5,0,.8,.5) forwards}
.ob-lid{opacity:0;animation:lid .5s 1.5s cubic-bezier(.3,1.6,.5,1) forwards}
.ob-star{opacity:0;animation:fadein .4s 1.9s forwards}
.plane{animation:plane .8s 1.1s cubic-bezier(.2,.8,.2,1) both,wiggle 3.5s 2.2s ease-in-out infinite}
</style>
</head>

<div class="scroll rel" style="margin-top:10px"><h1>${esc(c.t)}</h1>
${open?`<p>Opened ${fmt(c.d)}</p><div class="script" style="font-size:28px;margin-top:20px">Dear Future Me,</div><div style="font-size:16px;line-height:1.6;white-space:pre-wrap;margin-top:6px">${esc(c.letter||'')}</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px">${(c.photos||[]).map(k=>`<img src="${IMG[k]}" alt="${NAMES[k]}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:14px">`).join('')}</div>`
:`<p>Locked until ${fmt(c.d)}</p><div style="display:flex;flex-direction:column;align-items:center;margin-top:26px">${JAR}<div class="script" style="font-size:30px;color:var(--purple);transform:rotate(-2deg)">${n} days to go</div><p style="text-align:center;max-width:270px;margin-top:14px">Your letter and ${(c.photos||[]).length} photo${(c.photos||[]).length===1?'':'s'} are safe inside. No peeking until then.</p></div>`}
</div><button class="cta" style="margin-top:14px;background:#fff;color:var(--ink);border:1px solid var(--line)" data-act="del" data-i="${S.cur}">Delete capsule</button></div>`},

memories:()=>{const L=d=>`${d.getDate()} ${MON[d.getMonth()]}, ${d.getFullYear()}`;
 const star=on=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="${on?'#8A8696':'none'}" stroke="#8A8696" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/></svg>`;
 const list=S.caps.map((c,i)=>({c,i})).filter(x=>!S.favOnly||x.c.fav);
 return `<div class="scr"><div class="glow" style="left:-100px;top:120px;width:300px;height:300px"></div>
<div class="top" style="gap:10px;margin-top:4px"><button class="back" style="width:34px" data-go="home" aria-label="Back">${ic.back}</button><h1 style="flex:1">Memories</h1>
<button class="circ" data-act="msearch" aria-label="Search memories"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D1D1F" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg></button>
<button class="circ" data-act="mfav" aria-label="Show favourites" aria-pressed="${S.favOnly}" style="${S.favOnly?'background:#E8E2F6':''}">${star(S.favOnly)}</button></div>
<div ${S.mq?'':'hidden'} id="mqw" style="margin-top:12px"><label for="mq" style="position:absolute;width:1px;height:1px;overflow:hidden">Search memories</label><input id="mq" class="field" style="height:44px;border-radius:999px;font-size:14px" placeholder="Search memories"></div>
<div class="scroll" style="margin-top:20px"><div class="tl">
${list.map(({c,i})=>{const ph=(c.photos||[]).slice(0,2);return `<div class="ent" data-t="${esc((c.t+' '+(c.letter||'')).toLowerCase())}" data-cap="${i}" role="button" tabindex="0">
<button class="fav" data-fav="${i}" aria-label="${c.fav?'Remove from':'Add to'} favourites" aria-pressed="${!!c.fav}">${star(c.fav)}</button>
${ph.length?`<div class="th">${ph.map(k=>`<img src="${IMG[k]}" alt="${NAMES[k]}">`).join('')}</div><h3 style="padding-right:30px">${esc(c.t)}</h3>`:`<div class="script" style="font-size:26px;line-height:1.1;color:var(--purple)">Dear Future Me,</div>`}
<div class="ex">${esc(c.letter||'')}</div><div class="dt">${L(c.made||today)}${days(c.d)>0?' · Opens '+fmt(c.d):''}</div></div>`}).join('')||'<p style="margin:0 0 16px">Nothing here yet. Seal a capsule and it will show up on this timeline.</p>'}
<div id="mnone" hidden style="color:var(--grey);font-size:14px;margin-bottom:16px">No memory matches that.</div>
<svg width="34" height="22" viewBox="0 0 34 22" style="margin:-4px 0 10px -2px;display:block"><path d="M9 21a7 7 0 0 1-.6-14A9 9 0 0 1 25.5 8 6.5 6.5 0 0 1 26 21z" fill="#E3DFEE"/></svg>
</div></div>
<button class="cta" data-act="new" style="margin-top:12px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New Capsule</button></div>`},

account:()=>{const ph=S.caps.reduce((a,c)=>a+(c.photos||[]).length,0),next=[...S.caps].filter(c=>days(c.d)>0).sort((a,b)=>a.d-b.d)[0];
 return `<div class="scr"><div class="glow" style="right:-100px;top:40px;width:300px;height:300px"></div>
<div class="rel" style="margin-top:18px;display:flex;flex-direction:column;align-items:center;text-align:center"><img src="${IMG.avatar}" alt="" width="96" height="96" style="border-radius:50%;object-fit:cover;box-shadow:0 10px 26px rgba(70,55,110,.2)"><h1 style="margin-top:14px;font-size:26px">${esc(S.name||'Guest')}</h1><p style="margin-top:4px">Member since ${fmt(new Date(S.joined))}${S.goal?' · saves '+esc(S.goal.toLowerCase()):''}</p></div>
<div class="rel" style="display:flex;gap:10px;margin-top:20px"><div class="stat card"><b>${S.caps.length}</b><span>Capsules</span></div><div class="stat card"><b>${ph}</b><span>Photos</span></div><div class="stat card"><b>${next?days(next.d):'-'}</b><span>Days to next</span></div></div>
<div class="scroll" style="margin-top:18px;padding-bottom:100px"><div style="display:flex;flex-direction:column;gap:10px">
<label class="lbl" for="ename">Display name</label><div style="display:flex;gap:8px"><input id="ename" class="field" maxlength="24" value="${esc(S.name)}"><button class="cta" style="width:90px;height:52px;font-size:14px" data-act="rename">Save</button></div>
<button class="row card" data-go="settings" style="margin-top:8px"><span style="font-weight:600">Settings</span><span style="color:var(--grey)">›</span></button>
<button class="row card" data-act="logout"><span style="font-weight:600;color:#B3402F">Log out</span><span style="color:var(--grey)">›</span></button></div></div>${nav('account')}</div>`},

settings:()=>`<div class="scr"><div class="glow" style="left:-100px;top:100px;width:300px;height:300px"></div>
<div class="rel" style="margin-top:18px"><h1>Settings</h1><p>Keep Dear Future Me working the way you like.</p></div>
<div class="scroll" style="margin-top:18px;padding-bottom:100px"><div style="display:flex;flex-direction:column;gap:10px">
<button class="row card" data-pref="remind" role="switch" aria-checked="${S.pref.remind}"><span><b style="font-weight:600;display:block">Opening day reminder</b><span style="font-size:13px;color:var(--grey)">Nudge me when a capsule unlocks</span></span><span class="sw ${S.pref.remind?'on':''}"></span></button>
<button class="row card" data-pref="hide" role="switch" aria-checked="${S.pref.hide}"><span><b style="font-weight:600;display:block">Hide letter titles</b><span style="font-size:13px;color:var(--grey)">Show “Capsule” instead of names</span></span><span class="sw ${S.pref.hide?'on':''}"></span></button>
<button class="row card" data-act="replay"><span><b style="font-weight:600;display:block">Replay onboarding</b><span style="font-size:13px;color:var(--grey)">See the welcome flow again</span></span><span style="color:var(--grey)">›</span></button>
<button class="row card" data-act="reset"><span><b style="font-weight:600;display:block">Reset sample capsules</b><span style="font-size:13px;color:var(--grey)">Restore the three starter capsules</span></span><span style="color:var(--grey)">›</span></button>
<p style="text-align:center;font-size:12px;margin-top:10px">Dear Future Me · prototype v2</p></div></div>${nav('settings')}</div>`
});
function render(){const same=S.screen===S._last;S._last=S.screen;S.menu=S.screen==='home'?S.menu:null;
 app.innerHTML=V[S.screen]();if(same){const s=app.firstElementChild;if(s&&s.classList&&s.classList.contains('scr'))s.style.animation='none'}
 bind();post()}
function post(){S.pop=null;S.popg=null;S.popDay=null;
 if(S.screen==='date'&&S.date){const el=$('#dn');if(el){const to=days(S.date),from=S.shown==null?to:S.shown;S.shown=to;if(from!==to){const t0=performance.now();el.classList.remove('bump');void el.offsetWidth;el.classList.add('bump');const step=n=>{const k=Math.min(1,(n-t0)/450);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)}}}
 else if(S.screen!=='date')S.shown=null}
const shrink=f=>new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const m=640,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u});
function confetti(){const c=['#F0B8A0','#BFD8F0','#CFC2EE','#F4D77A','#BFE0C8','#E58AA0'];return Array.from({length:32},(_,i)=>`<i class="conf" style="left:${Math.random()*100}%;background:${c[i%6]};--x:${(Math.random()-.5)*140}px;--r:${Math.random()*720}deg;animation-delay:${Math.random()*.5}s;animation-duration:${1.8+Math.random()*1.4}s"></i>`).join('')}
function sealAnim(){if(S.sealing)return;S.sealing=true;
 const rm=matchMedia('(prefers-reduced-motion: reduce)').matches,first=S.photos[0],cl=['#F0B8A0','#BFD8F0','#CFC2EE','#F4D77A','#BFE0C8','#E58AA0'];
 const sp=Array.from({length:12},(_,i)=>{const a=i/12*6.283,r=70+Math.random()*30;return `<i class="sp" style="background:${cl[i%6]};--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px"></i>`}).join('');
 const item=first?polaroid(first,0,100):`<div style="background:#fff;border-radius:10px;padding:16px 10px;box-shadow:0 20px 40px rgba(70,55,110,.18);text-align:center"><div class="script" style="font-size:20px">Dear Future Me,</div></div>`;
 const o=document.createElement('div');o.className='seal';o.setAttribute('role','status');
 o.innerHTML=`<div class="stage"><svg class="jar" width="160" height="200" viewBox="0 0 120 150" aria-hidden="true"><path d="M30 34Q12 44 12 68V118Q12 142 36 142H84Q108 142 108 118V68Q108 44 90 34Z" fill="#F4F0FB" stroke="#CFC6EA" stroke-width="1.8"/><g class="jstar"><circle cx="60" cy="90" r="32" fill="#FFF1BF" opacity=".7"/><path d="M60 66L66 82 83 83 70 94 74 111 60 102 46 111 50 94 37 83 54 82Z" fill="#F7D56E" stroke="#E7B93C" stroke-width="2" stroke-linejoin="round"/></g><path d="M22 58Q20 76 22 96" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none" opacity=".85"/><g class="lid"><rect x="34" y="6" width="52" height="15" rx="6" fill="#E3DDF3" stroke="#C9BFE6" stroke-width="1.5"/><rect x="38" y="21" width="44" height="12" fill="#F1EDFA" stroke="#D5CCEC" stroke-width="1.5"/></g></svg>${sp}<div class="item">${item}</div></div><div id="st" class="script" style="font-size:30px;color:var(--purple)">Sealing your capsule…</div>`;
 app.appendChild(o);
 S.caps.unshift({t:S.title.trim(),img:S.cover||S.photos[0]||'ocean',d:S.date,letter:S.letter,made:new Date(),photos:[...S.photos]});save();
 setTimeout(()=>{const e=$('#st');if(e)e.textContent='Sealed!'},rm?150:1900);
 setTimeout(()=>{S.sealing=false;go('sealed')},rm?600:2750)}

function bind(){
 app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{if(!b.disabled)go(b.dataset.go)});
 const t=$('#title');if(t){t.oninput=()=>{S.title=t.value;$('#next').disabled=!t.value.trim()}}
 app.querySelectorAll('[data-cover]').forEach(b=>b.onclick=()=>{S.cover=S.cover===b.dataset.cover?null:b.dataset.cover;if(S.cover)S.pop=S.cover;S.title=($('#title')||{}).value||S.title;render()});
 const l=$('#letter');if(l){l.oninput=()=>{S.letter=l.value;$('#cnt').textContent=l.value.length+'/1000';$('#next').disabled=!l.value.trim()}}
 app.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{const k=b.dataset.photo,i=S.photos.indexOf(k);
  if(i>=0)S.photos.splice(i,1);else if(S.photos.length<6){S.photos.push(k);S.pop=k}else{const bb=b;bb.classList.add('shake');return toast('You can pick up to 6 photos')}
  render()});
 app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{S.date=new Date(S.view.getFullYear(),S.view.getMonth(),+b.dataset.day);S.popDay=+b.dataset.day;render()});
 app.querySelectorAll('[data-mo]').forEach(b=>b.onclick=()=>{if(b.disabled)return;S.view=new Date(S.view.getFullYear(),S.view.getMonth()+ +b.dataset.mo,1);render()});
 app.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{const a=b.dataset.act;
  if(a==='new'){Object.assign(S,{title:'',letter:'',photos:[],date:null,cover:null});S.view=new Date(today.getFullYear(),today.getMonth()+1,1);S.shown=null;go('create')}
  if(a==='surprise'){if(S.busy)return;S.busy=1;let i=0;const iv=setInterval(()=>{const d=new Date(today);d.setDate(d.getDate()+30+Math.floor(Math.random()*1000));S.date=d;S.view=new Date(d.getFullYear(),d.getMonth(),1);if(++i>=9){clearInterval(iv);S.busy=0;S.popDay=d.getDate()}render()},70)}
  if(a==='seal')sealAnim();
  if(a==='done')go('home')});
 app.querySelectorAll('.ent[data-cap]').forEach(e=>{e.onclick=ev=>{if(ev.target.closest('.fav'))return;S.cur=+e.dataset.cap;go('detail')};e.onkeydown=ev=>{if(ev.key==='Enter'){S.cur=+e.dataset.cap;go('detail')}}});
 app.querySelectorAll('[data-fav]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();const c=S.caps[+b.dataset.fav];c.fav=!c.fav;save();render()});
 const ms=$('[data-act=msearch]');if(ms)ms.onclick=()=>{S.mq=!S.mq;$('#mqw').hidden=!S.mq;if(S.mq)$('#mq').focus()};
 const mf=$('[data-act=mfav]');if(mf)mf.onclick=()=>{S.favOnly=!S.favOnly;render()};
 const mq=$('#mq');if(mq)mq.oninput=()=>{const v=mq.value.trim().toLowerCase();let n=0;app.querySelectorAll('.ent').forEach(e=>{const h=!e.dataset.t.includes(v);e.hidden=h;if(!h)n++});$('#mnone').hidden=n>0};

 const fi=$('#file');if(fi){const al=$('#addl');al.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();fi.click()}};
  fi.onchange=async()=>{let bad=0,over=0;for(const f of [...fi.files]){if(!f.type.startsWith('image/')){bad++;continue}
   try{const url=await shrink(f),k='u'+(++S.uid);IMG[k]=url;NAMES[k]='Your photo';S.uploads[k]=url;S.upl.unshift(k);if(S.photos.length<6){S.photos.push(k);S.pop=k}else over++}catch(e){bad++}}
   fi.value='';save();render();if(bad)toast("Some files could not be read as photos");else if(over)toast('Added. Only 6 can be selected')}}
 const hs=$('[data-act=hsearch]');if(hs)hs.onclick=()=>{S.hq=!S.hq;$('#hqw').hidden=!S.hq;if(S.hq)$('#q').focus()};
 app.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{const i=+b.dataset.menu;S.menu=S.menu===i?null:i;render()});

 const cf=$('#cfile');if(cf){const al=$('#caddl');al.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cf.click()}};
  cf.onchange=async()=>{const f=cf.files[0];if(!f)return;S.title=($('#title')||{}).value||S.title;
   if(!f.type.startsWith('image/')){toast('Please choose an image file');return}
   try{const url=await shrink(f),k='u'+(++S.uid);IMG[k]=url;NAMES[k]='Your photo';S.uploads[k]=url;S.cupl.unshift(k);S.cover=k;S.pop=k;cf.value='';save();render()}catch(e){toast('Could not read that image')}}}

 const ob=$('#obbody');if(ob){let x0=null;const sc=app.firstElementChild;sc.onpointerdown=e=>{x0=e.clientX};sc.onpointerup=e=>{if(x0==null)return;const dx=e.clientX-x0;x0=null;if(dx<-50)S.ob<2?obShow(S.ob+1,1):0;else if(dx>50)obShow(S.ob-1,-1)};
  app.querySelectorAll('[data-dot]').forEach(d=>d.onclick=()=>{const n=+d.dataset.dot;if(n!==S.ob)obShow(n,n>S.ob?1:-1)})}
 const rp=$('[data-act=replay]');if(rp)rp.onclick=()=>{S.ob=0;go('splash')};

 app.querySelectorAll('[data-ob]').forEach(b=>b.onclick=()=>{S.ob=0;go('ob')});
 const nx=$('[data-obnext]');if(nx)nx.onclick=()=>{if(S.ob<2)obShow(S.ob+1,1);else go('signup')};
 const bk=$('[data-obback]');if(bk)bk.onclick=()=>{if(S.ob>0)obShow(S.ob-1,-1);else go('splash')};
 const nm=$('#nm');if(nm)nm.oninput=()=>{S.name=nm.value;$('#next').disabled=!nm.value.trim();const h=$('#hi');if(h){h.textContent=nm.value.trim()?'Hi, '+nm.value.trim()+'!':'Hi there!';h.classList.remove('bump');void h.offsetWidth;h.classList.add('bump')}};
 app.querySelectorAll('[data-goal]').forEach(b=>b.onclick=()=>{S.goal=S.goal===b.dataset.goal?'':b.dataset.goal;S.popg=S.goal;S.name=($('#nm')||{}).value||S.name;render()});
 app.querySelectorAll('button[data-cap]').forEach(b=>b.onclick=()=>{S.cur=+b.dataset.cap;go('detail')});
 app.querySelectorAll('[data-pref]').forEach(b=>b.onclick=()=>{S.pref[b.dataset.pref]=!S.pref[b.dataset.pref];save();render()});
 const q=$('#q');if(q)q.oninput=()=>{const v=q.value.trim().toLowerCase();let n=0;app.querySelectorAll('[data-t]').forEach(e=>{const h=!e.dataset.t.includes(v);e.hidden=h;if(!h)n++});$('#none').hidden=n>0||!S.caps.length};
 app.querySelectorAll('[data-act]').forEach(b=>{const a=b.dataset.act;
  if(a==='start')b.onclick=()=>{if(b.disabled)return;S.name=S.name.trim();S.onboarded=true;save();go('welcome')};
  if(a==='rename')b.onclick=()=>{const v=$('#ename').value.trim();if(!v)return toast('Name cannot be empty');S.name=v;save();render();toast('Name updated')};
  if(a==='logout')b.onclick=()=>{S.onboarded=false;S.ob=0;try{localStorage.removeItem(KEY)}catch(e){};S.caps=SEED();S.name='';S.goal='';go('splash')};
  if(a==='reset')b.onclick=()=>{S.caps=SEED();save();toast('Sample capsules restored');render()};
  if(a==='del')b.onclick=()=>{S.caps.splice(+b.dataset.i,1);save();go('home')};
 });
}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;app.appendChild(e);setTimeout(()=>e.remove(),1800)}
document.addEventListener('keydown',e=>{if(S.screen!=='ob')return;if(e.key==='ArrowRight')S.ob<2?obShow(S.ob+1,1):go('signup');if(e.key==='ArrowLeft')obShow(S.ob-1,-1)});
load();render();
</script>

</body>
</html>
